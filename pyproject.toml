[project]
name = "oracle-agent"
version = "0.1.0"
description = "Lawson Diagnostic Audit automation (Jester + Oracle phases) -- OI-ORACLE-01"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "pydantic>=2.7",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oracle-agent = "oracle_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
