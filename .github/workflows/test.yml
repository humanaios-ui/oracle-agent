name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # this job only runs the test suite; it needs no write access even on a repo whose default token permissions are broader (Copilot review, PR #1)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 -- pinned for consistency with oracle-audit.yml (which holds write + secrets)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -e .
      - run: pytest -q
